<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فروشگاه لوازم جانبی موبایل</title>
    <style>
        {
            margin: 0;padding: 0; box-sizing: border-box;
        }
        body {
            font-family: Tahoma, sans-serif; background: #f0f2f5; padding: 20px;
        }
        .container {
            background:blak;
            padding: 30px 35px;
            max-width: 550px;
            width: 100%;
        }
        h1 {
            text-align: center;
            color:blou;
            font-size: 24px;
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }
        input[type="text"],
        textarea {
            width: 100%;
            padding: 10px 12px;
            margin-top: 5px;
            border: 2px solid #dce4ec;
            font-size: 14px;
            font-family: Tahoma, sans-serif;
            box-sizing: border-box;
            background: #fafcff;
        }
        input[type="text"]:focus,
        textarea:focus {
            border-color: #4a90e2;
            outline: none;
            background: #ffffff;
        }
        textarea {
            resize: vertical;
            min-height: 60px;
        }
        .product-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background:#f8faff;
            padding: 10px 15px;
            margin-top: 10px;
            border: 1px solid #e9edf4;
        }
        .product-item:hover {
            border-color: #b0c8e0;
        }
        .product-item label {
            margin: 0;
            font-weight: normal;
            flex: 1;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .product-item input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }
        .price {
            color: #27ae60;
            font-weight: bold;
            background: #eafaf1;
            padding: 3px 12px;
            border-radius: 20px;
            font-size: 13px;
            white-space: nowrap;
        }
        .btn {
            background: #4a90e2;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            width: 100%;
            cursor: pointer;
            margin-top: 20px;
        }
        .btn:hover {
            background: #357abd;
            transform: scale(1.01);
        }
        #orderMessage {
            margin-top: 18px;
            padding: 14px;
            border-radius: 12px;
            text-align: center;
            font-weight: bold;
            display: none;
            font-size: 15px;
        }
        .message-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .message-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .footer-note {
            text-align: center;
            font-size: 12px;
            color: #8a9aa8;
            margin-top: 20px;
            border-top: 1px solid #eee;
            padding-top: 15px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>📱 لوازم جانبی موبایل</h1>
    <label>نام و نام خانوادگی:</label>
    <input type="text" id="fullName" placeholder>

    <label>آدرس:</label>
    <textarea id="address" placeholder="آدرس کامل خود را وارد کنید..."></textarea>
    <div style="margin-top: 20px;">
        <p style="font-weight: bold; color: #2c3e50; margin-bottom: 5px;">🛍️ محصولات:</p>

        <div class="product-item">
            <label><input type="checkbox" class="product" data-name="گوشی موبایل"> گوشی موبایل</label>
            <span class="price">۱۲,۰۰۰,۰۰۰ تومان</span>
        </div>

        <div class="product-item">
            <label><input type="checkbox" class="product" data-name="هدفون بی‌سیم"> هدفون بی‌سیم</label>
            <span class="price">۲,۸۰۰,۰۰۰ تومان</span>
        </div>

        <div class="product-item">
            <label><input type="checkbox" class="product" data-name="پاوربانک"> پاوربانک</label>
            <span class="price">۴,۵۰۰,۰۰۰ تومان</span>
        </div>

        <div class="product-item">
            <label><input type="checkbox" class="product" data-name="قاب گوشی"> قاب گوشی</label>
            <span class="price">۴۲۰,۰۰۰ تومان</span>
        </div>

        <div class="product-item">
            <label><input type="checkbox" class="product" data-name="محافظ صفحه"> محافظ صفحه</label>
            <span class="price">۲۳۰,۰۰۰ تومان</span>
        </div>

        <div class="product-item">
            <label><input type="checkbox" class="product" data-name="پایه نگهدارنده"> پایه نگهدارنده</label>
            <span class="price">۱,۱۰۰,۰۰۰ تومان</span>
        </div>
    </div>
    <button class="btn" onclick="submitOrder()">📝 ثبت سفارش</button>
    <div id="orderMessage"></div>

    <div class="footer-note">
        فروشگاه لوازم جانبی موبایل
    </div>
</div>

<script>
    function submitOrder() {
        var name = document.getElementById('fullName').value.trim();
        var address = document.getElementById('address').value.trim();
        var msgBox = document.getElementById('orderMessage');
        if (name === '') {
            msgBox.innerHTML = '⚠️ لطفاً نام و نام خانوادگی خود را وارد کنید.';
            msgBox.className = 'message-error';
            msgBox.style.display = 'block';
            return;
        }
        if (address === '') {
            msgBox.innerHTML = '⚠️ لطفاً آدرس خود را وارد کنید.';
            msgBox.className = 'message-error';
            msgBox.style.display = 'block';
            return;
        }
        var selected = document.querySelectorAll('.product:checked');
        if (selected.length === 0) {
            msgBox.innerHTML = '⚠️ حداقل یک کالا را انتخاب کنید.';
            msgBox.className = 'message-error';
            msgBox.style.display = 'block';
            return;
        }
        msgBox.innerHTML = '✅ ' + name + ' عزیز، سفارش شما با موفقیت ثبت شد.';
        msgBox.className = 'message-success';
        msgBox.style.display = 'block';
    }
</script>
</body>
</html>
